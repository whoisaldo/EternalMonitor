name: EternalMonitor
options:
  bundleIdPrefix: com.eternal
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  EternalMonitor:
    type: application
    platform: iOS
    sources:
      - path: EternalMonitor
        excludes:
          - "Resources/Fonts/**"
    resources:
      - path: EternalMonitor/Resources/Assets.xcassets
      - path: EternalMonitor/Resources/Fonts/Syne-Variable.ttf
        buildPhase: resources
      - path: EternalMonitor/Resources/Fonts/JetBrainsMono-Regular.ttf
        buildPhase: resources
      - path: EternalMonitor/Resources/Fonts/JetBrainsMono-Medium.ttf
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: EternalMonitor/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.eternal.monitor
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_XR: "NO"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
