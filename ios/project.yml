name: EternalMonitor
options:
  bundleIdPrefix: com.eternal
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  EternalMonitor:
    type: application
    platform: iOS
    sources:
      - path: EternalMonitor
    settings:
      base:
        INFOPLIST_FILE: EternalMonitor/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.eternal.monitor
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_XR: "NO"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        DEVELOPMENT_TEAM: "9X79V37Q89"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE

  EternalMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EternalMonitorTests
      # Golden wire vectors shared byte-for-byte with `cargo test -p eternal-wire`.
      - path: ../proto/testdata
        type: folder
        buildPhase: resources
    dependencies:
      - target: EternalMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.eternal.monitor.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EternalMonitor.app/EternalMonitor"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  EternalMonitor:
    build:
      targets:
        EternalMonitor: all
        EternalMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EternalMonitorTests
    profile:
      config: Release
    archive:
      config: Release
