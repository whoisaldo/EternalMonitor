[package]
name = "eternal-host"
version = "0.1.0"
edition = "2021"

[dependencies]
eternal-proto = { path = "../proto" }
ffmpeg-next = { version = "7", features = ["codec", "format", "software-scaling"] }
libc = "0.2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# GUI
eframe = "0.31"

# mDNS service advertisement
mdns-sd = "0.12"

# Shared state
parking_lot = "0.12"
once_cell = "1"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Registry",
]
